[project]
name = "micromachines"
version = "0.1.0"
description = "Weight-space micromachines: hand-written ReLU implants for a frozen language model"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch", "transformers", "numpy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["micromachines", "micromachines.circuits"]
